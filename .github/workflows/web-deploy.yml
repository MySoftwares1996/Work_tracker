# Builds the web version - the new web app in newweb/ (docs/NEW_WEB.md) - and puts it on Firebase Hosting, after every push to main.
# Setup: docs/DEPLOY_WEB.md
name: Deploy web version

on:
  workflow_dispatch:          # the "Run workflow" button on the Actions tab
  push:
    branches: [main]          # and every push to main

concurrency:
  group: web-deploy
  cancel-in-progress: false   # never stop a deploy half-way; the next one waits

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Check the deploy settings are set
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          missing=0
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set (docs/DEPLOY_WEB.md, step 3)"; missing=1; fi
          if [ -z "$FIREBASE_HOSTING_SITE" ]; then echo "::error::Variable FIREBASE_HOSTING_SITE is not set (docs/DEPLOY_WEB.md, step 4)"; missing=1; fi
          exit $missing

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the project checks and tests
        run: npm run verify

      - name: Build the web version (newweb/)
        working-directory: newweb
        env:
          # Optional: the project's own Firebase Web app keys (docs/DEPLOY_WEB.md, "If sign-in says...").
          # The old EXPO_PUBLIC_* variables are used when the VITE_* ones are not set.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
          # Optional: the reCAPTCHA v3 site key for App Check (docs/NEW_WEB.md, "App Check").
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Sign in to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
          WEB_DIST_DIR: newweb/dist
          # "true" also deploys firestore.rules (docs/DEPLOY_WEB.md, "Security rules").
          DEPLOY_FIRESTORE_RULES: ${{ vars.DEPLOY_FIRESTORE_RULES }}
        run: npm run deploy:web

      - name: Show the address
        if: success()
        run: echo "### Live at https://${{ vars.FIREBASE_HOSTING_SITE }}.web.app" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
