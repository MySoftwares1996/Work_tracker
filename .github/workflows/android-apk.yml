# Builds a signed Android APK on GitHub's servers.
# Setup: docs/BUILD_WITH_GITHUB.md
name: Build Android APK

on:
  workflow_dispatch:          # the "Run workflow" button on the Actions tab
  push:
    branches: [main]          # and every push to main

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true    # a newer push replaces a build still running

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Check the signing secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set (docs/BUILD_WITH_GITHUB.md, Part D)"; missing=1; fi
          done
          exit $missing

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the project checks and tests
        run: npm run verify

      - name: Set a build number higher than the installed app
        run: node scripts/ci-version-code.js "${{ github.run_number }}"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          # GitHub's runner is small. The first build failed after 31 minutes
          # with OutOfMemoryError: Metaspace in the Kotlin compiler's separate
          # daemon process. Compile Kotlin inside Gradle instead, and give
          # Gradle more heap and class metadata space.
          cat >> gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=2
          PROPS
          # arm64-v8a only: every current phone. The default also compiled
          # three emulator/old-phone variants, quadrupling the native build.
          # Release lint checks are skipped on CI only (see the init script).
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -I ../scripts/ci-skip-lint-vital.gradle

      - name: Refuse an APK signed with the debug key
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the DEBUG key and would not install as a proper release."
            exit 1
          fi
          VERSION=$(node -p "require('./app.json').expo.version")
          mv "$APK" "WorkingDashboard-v${VERSION}-build${{ github.run_number }}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkingDashboard-APK
          path: WorkingDashboard-*.apk
          retention-days: 30

      - name: Remove the signing key from the build machine
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
