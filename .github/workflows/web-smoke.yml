name: Website smoke test

# Opens the built website (newweb/, demo data) in a real browser (desktop and phone width) and walks every tab and every Config
# topic. Fails on any page or console error. Run it from the Actions tab before a deploy.
# Manual only (the owner asked): it does not start on pull requests or pushes.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm run verify
      - name: Build the website (newweb/)
        working-directory: newweb
        run: npm ci --no-audit --no-fund && npx vite build
      - name: Install a browser for the test
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Walk the website
        run: npm run smoke:web
